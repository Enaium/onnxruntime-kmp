name: Publish

"on":
  workflow_dispatch:

# Publishes every artifact from the runner that can build it. Maven Central
# coordinates are immutable, so each publication is produced by exactly one
# runner:
#
#   macos-14      -> :onnxruntime-kmp metadata + jvm + android + Apple
#                    klibs (macosArm64, macosX64; the macosX64 klib links
#                    the last Intel-mac build, onnxruntime 1.23.2)
#   ubuntu-latest -> :onnxruntime-kmp linuxX64 + linuxArm64 + mingwX64 klibs
#                    (the prebuilt libonnxruntime is downloaded by the build)
#
# The kotlinMultiplatform metadata module (published from macOS) redirects to
# the per-target klib modules, so all of them must be published before
# consumers can resolve the artifact.
#
# Trigger: run manually via the Actions tab. Version is fixed in the root
# build.gradle.kts; bump it before releasing again, since Maven Central does
# not allow republishing a version.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MAVEN_CENTRAL_USERNAME   Sonatype Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD   Sonatype Central Portal user-token password
#   SIGNING_KEY              base64-encoded PGP secret key ring (.gpg, binary)
#   SIGNING_KEY_ID           8-hex-digit key id (without the 0x prefix)
#   SIGNING_PASSWORD         Passphrase of the signing key

jobs:
  publish-macos:
    name: Publish macOS (metadata + jvm + android + Apple klibs + darwin libs)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish metadata, jvm, android and Apple target klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :onnxruntime-kmp:publishKotlinMultiplatformPublicationToMavenCentralRepository
          :onnxruntime-kmp:publishJvmPublicationToMavenCentralRepository
          :onnxruntime-kmp:publishAndroidPublicationToMavenCentralRepository
          :onnxruntime-kmp:publishMacosArm64PublicationToMavenCentralRepository
          :onnxruntime-kmp:publishMacosX64PublicationToMavenCentralRepository
          :onnxruntime-lib-macosarm64:publishToMavenCentral
          :onnxruntime-lib-macosx64:publishToMavenCentral
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-linux:
    name: Publish Linux (linuxX64 + linuxArm64 + mingwX64 klibs + linux/windows libs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish linux and mingw target klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :onnxruntime-kmp:publishLinuxX64PublicationToMavenCentralRepository
          :onnxruntime-kmp:publishLinuxArm64PublicationToMavenCentralRepository
          :onnxruntime-kmp:publishMingwX64PublicationToMavenCentralRepository
          :onnxruntime-lib-linuxx64:publishToMavenCentral
          :onnxruntime-lib-linuxarm64:publishToMavenCentral
          :onnxruntime-lib-mingwx64:publishToMavenCentral
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

