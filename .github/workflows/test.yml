name: Test

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Builds and tests each platform on the runner that can run it. The prebuilt
# libonnxruntime shared libraries are downloaded by the build itself, so no
# cross-compilers are needed; every klib except the Apple ones is built on
# the Linux runner, and every Apple klib on the macOS runner.
#
#   macOS ARM64   -> :onnxruntime-kmp metadata + jvm + android + Apple klibs,
#                    JVM + native tests, example executables
#   Linux x64     -> :onnxruntime-kmp linux/mingw klibs (with the prebuilt
#                    libonnxruntime embedded via linkerOpts), JVM + native
#                    tests, example executable
#   Windows x64   -> JVM tests, mingwX64 klib + test binary
#   Android       -> android AAR to Maven Local, example app + androidTest
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEY     base64-encoded PGP secret key ring (.gpg, binary)
#   SIGNING_KEY_ID  8-hex-digit key id (without the 0x prefix)
#   SIGNING_PASSWORD Passphrase of the signing key

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS ARM64
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish all platforms to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :onnxruntime-kmp:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :onnxruntime-kmp:jvmTest

      - name: Run native tests (macosArm64)
        run: ./gradlew --no-daemon :onnxruntime-kmp:macosArm64Test

      - name: Link macosX64 test binary
        run: ./gradlew --no-daemon :onnxruntime-kmp:linkDebugTestMacosX64

      - name: Build darwin lib artifacts
        run: >
          ./gradlew --no-daemon
          :onnxruntime-lib-macosarm64:jar
          :onnxruntime-lib-macosx64:jar

      - name: Run example JVM tests
        run: ./gradlew --no-daemon :example:jvmTest

      - name: Run example native tests (macosArm64)
        run: ./gradlew --no-daemon :example:macosArm64Test

      - name: Run example executables
        run: |
          ./gradlew --no-daemon :example:runMacosArm64
          ./gradlew --no-daemon :example:linkDebugExecutableMacosX64

      - name: Run full build
        run: ./gradlew --no-daemon build

  test-linux:
    name: Test Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish jvm and linux/mingw klibs to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :onnxruntime-kmp:publishKotlinMultiplatformPublicationToMavenLocal
          :onnxruntime-kmp:publishJvmPublicationToMavenLocal
          :onnxruntime-kmp:publishLinuxX64PublicationToMavenLocal
          :onnxruntime-kmp:publishLinuxArm64PublicationToMavenLocal
          :onnxruntime-kmp:publishMingwX64PublicationToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :onnxruntime-kmp:jvmTest

      - name: Run native tests (linuxX64)
        run: ./gradlew --no-daemon :onnxruntime-kmp:linuxX64Test

      - name: Link linuxArm64 and mingwX64 test binaries
        run: >
          ./gradlew --no-daemon
          :onnxruntime-kmp:linkDebugTestLinuxArm64
          :onnxruntime-kmp:linkDebugTestMingwX64

      - name: Build linux and windows lib artifacts
        run: >
          ./gradlew --no-daemon
          :onnxruntime-lib-linuxx64:jar
          :onnxruntime-lib-linuxarm64:jar
          :onnxruntime-lib-mingwx64:jar

      - name: Run example JVM tests
        run: ./gradlew --no-daemon :example:jvmTest

      - name: Run example native tests (linuxX64)
        run: ./gradlew --no-daemon :example:linuxX64Test

      - name: Run example executable (linuxX64)
        run: ./gradlew --no-daemon :example:runLinuxX64

      - name: Run full build
        run: ./gradlew --no-daemon build

  test-windows:
    name: Test Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length

      - name: Publish jvm and mingwX64 klibs to Maven Local
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :onnxruntime-kmp:publishKotlinMultiplatformPublicationToMavenLocal
          :onnxruntime-kmp:publishJvmPublicationToMavenLocal
          :onnxruntime-kmp:publishMingwX64PublicationToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon --stacktrace :onnxruntime-kmp:jvmTest

      - name: Run example JVM tests
        run: ./gradlew --no-daemon --stacktrace :example:jvmTest

      - name: Link mingwX64 test binary
        run: ./gradlew --no-daemon :onnxruntime-kmp:linkDebugTestMingwX64

  test-android:
    name: Test Android
    # GitHub-hosted runners don't support nested virtualization, so Android
    # emulators can't boot with hardware acceleration. The AAR is published
    # to Maven Local and the example app + instrumented-test APK are
    # assembled; the tests must be run on a local device.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish android AAR + metadata to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :onnxruntime-kmp:publishKotlinMultiplatformPublicationToMavenLocal
          :onnxruntime-kmp:publishAndroidPublicationToMavenLocal

      - name: Assemble Android app and androidTest APK
        run: ./gradlew --no-daemon :example-android:assembleDebug :example-android:assembleDebugAndroidTest
